name: ModelJudge AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_V8_COVERAGE: coverage
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: modeljudge
          POSTGRES_PASSWORD: modeljudge
          POSTGRES_DB: modeljudge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modeljudge -d modeljudge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run canonical build command
        run: npm run build
      - name: Run canonical test command
        run: npm test
      - name: Run ESLint
        working-directory: backend
        run: npm run lint
      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev
      - name: Start API integration server
        working-directory: backend
        run: |
          nohup npm start > /tmp/modeljudge-ci-server.log 2>&1 &
          for i in {1..30}; do
            node -e "fetch('http://127.0.0.1:10000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" && exit 0
            sleep 1
          done
          cat /tmp/modeljudge-ci-server.log
          exit 1
      - name: Run API integration suite explicitly
        working-directory: backend
        run: npm run test:integration
      - name: Stop API integration server
        if: always()
        run: pkill -f "scripts/start.js" || true
      - name: Prepare PostgreSQL integration database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://modeljudge:modeljudge@localhost:5432/modeljudge_test
          DATABASE_SSL: "false"
        run: npm run migrate
      - name: Run PostgreSQL-backed integration suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://modeljudge:modeljudge@localhost:5432/modeljudge_test
          DATABASE_SSL: "false"
          ADMIN_BOOTSTRAP_TOKEN: ci-postgres-bootstrap-token
        run: npm run test:postgres
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: modeljudge-coverage
          path: backend/coverage/
          if-no-files-found: warn
      - name: Validate dataset
        working-directory: backend
        run: npm run validate
      - name: Build dataset exports
        working-directory: backend
        run: npm run export
      - name: Run quality filter
        working-directory: backend
        run: npm run filter
      - name: Run reliability report
        working-directory: backend
        run: npm run reliability
      - name: Run reviewer control report
        working-directory: backend
        run: npm run reviewer-control
      - name: Run certification readiness report
        working-directory: backend
        run: npm run certification
      - name: Upload buyer quality artifacts
        uses: actions/upload-artifact@v5
        with:
          name: modeljudge-quality-reports
          path: |
            exports/manifest.json
            exports/quality-report.json
            exports/reviewer-quality.json
            exports/quality-filtered.jsonl
            exports/quality-filter-report.json
            exports/reliability-report.json
            exports/reviewer-control-report.json
            exports/certification-report.json
