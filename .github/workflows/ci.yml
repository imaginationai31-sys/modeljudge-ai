name: ModelJudge AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Validate dataset
        working-directory: backend
        run: npm run validate

      - name: Build dataset exports
        working-directory: backend
        run: npm run export

      - name: Run calibration quality engine
        working-directory: backend
        run: node ../scripts/calibration-engine.js

      - name: Upload quality reports
        uses: actions/upload-artifact@v5
        with:
          name: modeljudge-quality-reports
          path: |
            exports/manifest.json
            exports/quality-report.json
            exports/reviewer-quality.json
