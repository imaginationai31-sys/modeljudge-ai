<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModelJudge AI — Admin Buyers</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1100px;margin:auto;padding:40px 24px}.card{border:1px solid var(--border);border-radius:16px;padding:20px;margin:14px 0;background:var(--card)}input{padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:inherit}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--border)}.muted{color:var(--muted)}</style></head><body><main><p class="eyebrow">ADMIN</p><h1>Buyer Management</h1><p class="muted">Administrative buyer controls. Keep this page behind your production admin authentication and do not publish it as a public portal.</p><div class="card"><label>Admin session bearer token <input id="token" type="password" placeholder="Bearer token"></label> <button class="button primary" id="load">Load buyers</button><div id="status" class="status">Not connected</div></div><div class="card"><h2>Buyers</h2><div id="buyers">No data.</div></div></main><script>const t=document.getElementById('token'),s=document.getElementById('status'),b=document.getElementById('buyers');async function load(){try{const r=await fetch('/api/admin/buyers',{headers:{Authorization:'Bearer '+t.value}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');b.innerHTML='<table><tr><th>Buyer</th><th>Company</th><th>Status</th><th>Keys</th><th>Active keys</th></tr>'+d.buyers.map(x=>`<tr><td>${x.buyer_id}</td><td>${x.company_name}</td><td>${x.status}</td><td>${x.api_key_count}</td><td>${x.active_api_key_count}</td></tr>`).join('')+'</table>';s.textContent='Loaded';}catch(e){s.textContent=e.message;s.className='status danger';}}document.getElementById('load').onclick=load;</script></body></html>
